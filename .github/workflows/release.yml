name: Windows release

# tolken.exe is tolken in one file that needs nothing installed (see tolken.spec).
#
# Every push to main (a merged PR, or a commit made on main) runs the tests, builds tolken.exe,
# tests the exe itself (test_exe.py), tags the commit vYYYY.MM.DD.N (UTC; N counts that day's
# releases) and publishes tolken.exe on a GitHub Release for the tag. The newest one is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/tolken.exe
# A push to any other branch does the same up to the release: its exe is kept as a workflow
# artifact for a week, so a broken build shows up before it reaches main.
on:
  push:
    branches: ['**']

permissions:
  contents: write

# A newer push to a branch makes an older run moot; on main every push is a release, so none waits
# for another or is cancelled (each run is a group of its own).
concurrency:
  group: windows-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: tolken.exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      # pywinpty only for test_exe.py, which drives the full-screen interface in a pseudo console.
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pywinpty

      - name: Test
        run: python -m unittest test_tolken test_tui test_bench

      - name: Build tolken.exe
        run: pyinstaller tolken.spec

      - name: Test tolken.exe
        env:
          TOLKEN_EXE: dist/tolken.exe
        run: python -m unittest -v test_exe

      - name: Upload tolken.exe
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: tolken
          path: dist/tolken.exe
          if-no-files-found: error
          retention-days: 7

      # The tag is pushed before the release is made: a push of a tag that already exists is
      # rejected, so two pushes to main landing close together can't both take the same N; the
      # second re-reads the tags and takes the next one.
      - name: Reserve version tag
        id: version
        if: github.ref == 'refs/heads/main'
        run: |
          day=$(date -u '+%Y.%m.%d')
          for _ in 1 2 3 4 5; do
            last=$(git ls-remote --tags --refs origin \
              | sed -n "s|.*refs/tags/v${day//./\\.}\.\([0-9][0-9]*\)$|\1|p" \
              | sort -n | tail -1)
            tag="v$day.$(( ${last:-0} + 1 ))"
            git tag "$tag" "$GITHUB_SHA"
            if git push origin "refs/tags/$tag"; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "Reserved $tag"
              exit 0
            fi
            git tag -d "$tag"
          done
          echo "::error::Could not reserve a version tag for $day"
          exit 1

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/tolken.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "tolken ${TAG#v}" \
            --generate-notes \
            --latest \
            --verify-tag

      # A failed or cancelled release gives its tag back, so no tag is left without its exe.
      - name: Release the tag on failure
        if: ${{ !success() && steps.version.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            || git push origin ":refs/tags/$TAG"
